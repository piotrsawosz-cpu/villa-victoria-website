<style>
  :root {
    --vv-blue: #1A4E7A;
    --vv-sand: #D4A96A;
    --vv-cream: #F5F0E8;
    --vv-text: #222222;
    --vv-text-muted: #6A6A6A;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--vv-cream);
    color: var(--vv-text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.10);
    padding: 40px 32px 32px;
    max-width: 460px;
    width: 100%;
    text-align: center;
  }
  .logo { width: 140px; margin: 0 auto 18px; display: block; }
  h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    color: var(--vv-blue);
    margin: 0 0 10px;
  }
  p { margin: 0 0 16px; line-height: 1.5; color: var(--vv-text-muted); font-size: 15px; }
  .countdown {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--vv-cream);
    color: var(--vv-text);
    padding: 12px 18px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 14px;
    margin: 6px 0 18px;
  }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(26, 78, 122, 0.25);
    border-top-color: var(--vv-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback {
    display: block;
    margin-top: 10px;
    color: var(--vv-blue);
    font-size: 13px;
    text-decoration: underline;
  }

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5R9R4TBZ"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<main class="card">
  <img class="logo" src="brand/logo-horizontal.svg" alt="Villa Victoria"/>
  <h1>Connecting you to Piotr on WhatsApp…</h1>
  <p>Please stay on this page — we'll redirect you in a moment.</p>
  <div class="countdown">
    <span class="spinner" aria-hidden="true"></span>
    <span>Redirecting in <span id="vv-countdown">2</span>s…</span>
  </div>
  <a id="vv-fallback" class="fallback" href="https://wa.me/34692852918?text=Hi%20Piotr%2C%20I%27d%20like%20to%20inquire%20about%20availability%20and%20price%20for%20Villa%20Victoria.">
    Tap here if you're not redirected automatically.
  </a>
</main>

<script>
(function () {
  'use strict';

  var WA_PHONE = '34692852918';
  var REDIRECT_MS = 2000;

  var name = '';
  try { name = (sessionStorage.getItem('vv_lead_name') || '').trim(); } catch (e) {}

  var message = name
    ? 'Hi Piotr, this is ' + name + ". I'd like to inquire about availability and price for Villa Victoria."
    : "Hi Piotr, I'd like to inquire about availability and price for Villa Victoria.";

  var waUrl = 'https://wa.me/' + WA_PHONE + '?text=' + encodeURIComponent(message);

  var fallback = document.getElementById('vv-fallback');
  if (fallback) fallback.href = waUrl;

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'lead_submitted',
    lead_source: 'book-page',
    has_name: !!name
  });

  var countdownEl = document.getElementById('vv-countdown');
  var remaining = Math.ceil(REDIRECT_MS / 1000);
  var tickInterval = setInterval(function () {
    remaining -= 1;
    if (countdownEl && remaining >= 0) countdownEl.textContent = String(remaining);
    if (remaining <= 0) clearInterval(tickInterval);
  }, 1000);

  setTimeout(function () {
    try { sessionStorage.removeItem('vv_lead_name'); } catch (e) {}
    window.location.assign(waUrl);
  }, REDIRECT_MS);
})();
</script>

</body>
</html>
